name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y cmake g++
      - run: cmake -S "${{ github.workspace }}" -B "${{ runner.temp }}/cmake-build"
      - run: cmake --build "${{ runner.temp }}/cmake-build" -j
      - run: cd "${{ runner.temp }}/cmake-build" && ctest --output-on-failure